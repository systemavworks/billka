name: billka

services:
  db:
    image: postgres:16-alpine
    container_name: billka_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-billka}
      POSTGRES_USER: ${POSTGRES_USER:-billka}
      # `:?` aborta si falta o está vacía. `:-cambiame` arrancaba con una contraseña
      # conocida: la BD quedaba expuesta con credenciales publicadas en el repositorio.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD es obligatoria; make dev la genera en .env}
    ports:
      - "127.0.0.1:${BILLKA_DB_PORT:-15433}:5432"
    volumes:
      - billka_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    cpus: 1.0
    mem_limit: 1g
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  core:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.core
    container_name: billka_core
    restart: unless-stopped
    env_file:
      - ../../.env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET es obligatoria; make dev la genera en .env}
    ports:
      - "127.0.0.1:${BILLKA_CORE_PORT:-18080}:8080"
    depends_on:
      db:
        condition: service_healthy
    cpus: 1.0
    mem_limit: 1g
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  web:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.web
    container_name: billka_web
    restart: unless-stopped
    env_file:
      - ../../.env
    ports:
      - "127.0.0.1:${BILLKA_WEB_PORT:-13000}:3000"
    depends_on:
      core:
        condition: service_started
    cpus: 1.0
    mem_limit: 1g
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    image: caddy:2-alpine
    container_name: billka_caddy
    restart: unless-stopped
    ports:
      - "${BILLKA_CADDY_HTTP_PORT:-8088}:80"
      - "${BILLKA_CADDY_HTTPS_PORT:-8443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - billka_caddy_data:/data
      - billka_caddy_config:/config
    depends_on:
      web:
        condition: service_started
      core:
        condition: service_started
    cpus: 0.5
    mem_limit: 256m

volumes:
  billka_pgdata:
  billka_caddy_data:
  billka_caddy_config:

