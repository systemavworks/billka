name: billka-dev

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: billka
      POSTGRES_USER: billka
      POSTGRES_PASSWORD: billka
    ports:
      - "127.0.0.1:15433:5432"
    volumes:
      - billka_dev_pgdata:/var/lib/postgresql/data

volumes:
  billka_dev_pgdata:
